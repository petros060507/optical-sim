[project]
name = "minizemax"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pyyaml", "rich", "typer"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
ui  = ["PyQt5", "PyOpenGL"]          # работают также PyQt6 / PySide6 (шим ui/qt.py)

[project.scripts]
minizemax = "minizemax.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
